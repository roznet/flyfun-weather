# Expected frontal zones from Meteo-France carte des fronts
# Charts: 16/04 18Z through 19/04 00Z
# ECMWF init: 16/04 18Z (hour_offsets relative to this)
# GFS/ICON init: 17/04 00Z (6h later — score with --models ecmwf only)
#
# Key pattern: cold front trailing from depression W of Scotland,
# sweeping E through Ireland → UK → Channel → N France over 48h.
# Warm front from Atlantic depression visible from 16/04 18Z onward,
# in N Atlantic moving N. Cold front from Scandinavian system visible
# in Germany/Scandinavia through the period.
#
# Types: cold, warm, occluded, stationary
# Corrected from pilot review 2026-04-17.

- time: "16/04 18Z"
  hour_offset: 0
  notes: >
    Depression D ~57N 12W. Warm front extending E from D toward Scotland
    (atlantic_north zone). Cold front trailing S into mid-Atlantic.
    Cold front fragments over Germany/Scandinavia from separate system.
    Ridge "R" over Bay of Biscay.
  zones:
    atlantic_north: warm      # warm front from depression extending E
    atlantic_south: cold      # cold front extending into mid-Atlantic
    n_germany_baltic: cold    # cold front from Scandinavian system
    scandinavia_south: cold   # cold front fragments

- time: "17/04 00Z"
  hour_offset: 6
  notes: >
    Depression D deepened ~57N 10W. Warm front from D in N Atlantic and
    extending toward N UK/Ireland. Cold front in S Atlantic. No front
    reaching Bay of Biscay yet. Ridge "R" over France.
  zones:
    atlantic_north: warm      # warm front from depression
    uk_north_ireland: warm    # warm front extending toward Scotland
    atlantic_south: cold      # cold front in mid-Atlantic

- time: "17/04 06Z"
  hour_offset: 12
  notes: >
    Depression D deeper ~58N 8W. Cold front from D trailing S through
    Ireland and approaching S UK. Occluded front wrapping around D.
    Atlantic S clear — front fragments dissipated.
  zones:
    atlantic_north: cold      # cold front W of Ireland
    uk_north_ireland: cold    # cold front through Ireland
    uk_south: cold            # cold front approaching S UK from W
    bay_of_biscay: cold       # cold front tail

- time: "17/04 12Z"
  hour_offset: 18
  notes: >
    Depression D ~58N 5W over N Scotland. Warm front in N Atlantic ahead
    of system. Cold front from D trailing S through UK reaching Channel.
    Ridge "R" over France.
  zones:
    atlantic_north: warm      # warm front ahead of system
    uk_north_ireland: cold    # cold front through N UK/Ireland
    uk_south: cold            # cold front reaching S UK/Channel
    bay_of_biscay: cold       # cold front tail

- time: "18/04 00Z"
  hour_offset: 30
  notes: >
    Depression D moved to ~60N 0E (N Sea). Cold front from D trailing S
    through Channel and North Sea. Front has swept through UK. N UK/Ireland
    now clear — front has passed. Bay of Biscay still has cold front tail.
  zones:
    uk_south: cold            # cold front through Channel
    benelux_north_sea: cold   # cold front entering N Sea/Benelux
    bay_of_biscay: cold       # cold front tail

- time: "18/04 12Z"
  hour_offset: 42
  notes: >
    Cold front has passed through to N France/Benelux/Scandinavia.
    Atlantic now clear — new system still far west. Cold front remnants
    over N France, Benelux, and reaching S Scandinavia.
  zones:
    north_france: cold        # cold front crossing N France
    benelux_north_sea: cold   # cold front over Benelux
    scandinavia_south: cold   # cold front reaching S Scandinavia

- time: "19/04 00Z"
  hour_offset: 54
  notes: >
    Atlantic clear — fronts still far west. Cold front from Scandinavian
    depression trailing S through N Germany/Baltic and Benelux. Cold front
    remnants over N France. High pressure "A" over UK.
  zones:
    north_france: cold        # cold front over N France
    n_germany_baltic: cold    # cold front from Scandinavian system
    benelux_north_sea: cold   # cold front fragments from N Europe
