# Expected frontal zones from Météo-France carte des fronts
# Source: reseau 16/04/2026 12 UTC
# Annotated by visual inspection of surface analysis charts
#
# Types: cold, warm, occluded, stationary
# Our detection only has cold/warm/indeterminate — occluded maps to either
# cold or warm depending on which side dominates at 850hPa.
#
# "clear" zones are not listed — absence means clear.
# Zones outside the MF chart domain (e.g. Balkans detail) are best-effort.

- time: "17/04 00Z"
  hour_offset: -12  # before ECMWF 12Z init — not in our forecast range
  notes: >
    Depression W of Scotland (~57N, 8W). Occluded front from depression
    center curving N then cold front trailing SW through Ireland (~53N)
    down to Bay of Biscay (~47N, 8W) and continuing as cold front to
    ~43N, 15W in Atlantic. Warm front fragment E of depression toward
    Norway. Ridge "R" over Benelux/Germany. Cold front fragments over
    Balkans/Turkey (~40N, 25E). Anticyclone over central Atlantic.
  zones:
    atlantic_north: cold
    uk_north_ireland: occluded
    uk_south: cold         # cold front trailing through Channel approaches
    bay_of_biscay: cold    # cold front tail
    atlantic_south: cold   # cold front extending into Atlantic
    balkans: cold          # fragments

- time: "17/04 12Z"
  hour_offset: 0
  notes: >
    Depression deepened, now ~58N 5W (N of Scotland). Occluded front
    wrapping around depression center. Cold front moved E — now from
    Scotland (~58N) S through Ireland/UK (~53N, 5W) to Bay of Biscay
    (~48N, 10W) and into Atlantic. Cold front from separate depression
    approaching Iberia from SW (~38N, 12W). Cold front fragments
    Balkans. Ridge "R" still over Benelux/central Europe.
    Separate cold front over Scandinavia (~60N, 10E).
  zones:
    atlantic_north: cold    # cold front approaching from W
    atlantic_south: cold    # cold front in Atlantic toward Iberia
    uk_north_ireland: cold  # cold front through Ireland
    uk_south: cold          # cold front southern end near Channel
    bay_of_biscay: cold     # cold front tail
    scandinavia_south: cold # cold front fragment over S Scandinavia

- time: "18/04 00Z"
  hour_offset: 12
  notes: >
