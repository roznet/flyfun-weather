    scandinavia_south: occluded  # occluded front over S Scandinavia
    bay_of_biscay: cold       # cold front tail
    atlantic_south: cold      # Atlantic front approaching

- time: "18/04 12Z"
  hour_offset: 24
  notes: >
    Depression moved to ~62N 5E (over Norway). Deep low developing W
