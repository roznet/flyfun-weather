[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherbrief"
version = "0.1.0"
description = "Medium-range weather assessment for cross-country GA flights in Europe"
requires-python = ">=3.11"
dependencies = [
    "flyfun-common>=0.6.4",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # 0.15.1 adds the parser `reference` parameter and fixes month-boundary
    # timestamp inference (#519). Anything older silently mis-dates reports
    # collected just after a month rolls over, and lacks the kwarg the
    # verification repair script needs.
    "euro-aip>=0.15.1",
    "metpy>=1.5",
    "numpy>=1.24",
    # Observed-motion matching and polygon topology are production paths.
    # Both were previously either transitive (SciPy) or absent (Shapely).
    "scipy>=1.10",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "langchain>=1.2",
    "langgraph>=1.0",
    # >=1.5: 1.3.x reported TTL-tiered cache writes in
    # input_token_details["cache_creation"]; 1.5.x zeroes that and uses
    # ephemeral_{5m,1h}_input_tokens. digest/llm_digest.py handles both,
    # but the floor keeps a fresh dev venv on the shape prod actually runs.
    "langchain-anthropic>=1.5",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "authlib>=1.3",
    "pyjwt>=2.8",
    "httpx[http2]>=0.27",
    "fastmcp>=2.13",
    "itsdangerous>=2.1",
    "SRTM.py>=0.3.7",
    "PyMuPDF>=1.24",
    "cfgrib>=0.9.12",
    # eccodes 2.45+ is needed to decode GRIB2 tablesVersion=35, used by
    # IFS Cycle 50r1 (12-May-2026). Older versions fail with opaque
    # "unknown parameter" errors on pressure-level messages.
    "eccodes>=2.45",
    "xarray>=2024.1",
    # Was transitive via MetPy; the HRRR Lambert-grid decode + domain gate
    # (#457) depend on it directly, so pin it explicitly.
    "pyproj>=3.4",
    "timezonefinder>=6.2",
    # Row-level Parquet archive for the verification tables (#522). Imported
    # lazily inside tasks/archive so a deployment that hasn't enabled the
    # archive still starts if the wheel is missing.
    "pyarrow>=15",
    # Observed conditions (#574). The OPERA radar composite is ODIM_H5, and
    # the EUMETSAT MTG products are netCDF fetched through eumdac. All three
    # were installed ad hoc in the dev venv and in no manifest; declared here
    # so a fresh environment can run the collector.
    #
    # Deliberately NO GDAL/rasterio: pyproj (already a dependency for the HRRR
    # Lambert grid) plus numpy covers every projection and resampling step
    # these products need, and the droplet does not gain a C toolchain for it.
    "h5py>=3.10",
    "netCDF4>=1.6",
    "eumdac>=3.0",
    # Observed overlays are rendered to PNG with Pillow. Available transitively
    # via matplotlib today, but imported directly by observed/imagery.py — the
    # same reason pyproj is pinned explicitly above.
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-mock>=3.0", "responses>=0.25"]
frontal-dev = ["cartopy>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (skipped by default, run with: pytest -m slow)",
]
