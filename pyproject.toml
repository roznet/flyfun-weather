[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherbrief"
version = "0.1.0"
description = "Medium-range weather assessment for cross-country GA flights in Europe"
requires-python = ">=3.11"
dependencies = [
    "flyfun-common>=0.6.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "euro-aip>=0.12.0",
    "metpy>=1.5",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "langchain>=1.2",
    "langgraph>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "authlib>=1.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "fastmcp>=2.13",
    "itsdangerous>=2.1",
    "SRTM.py>=0.3.7",
    "PyMuPDF>=1.24",
    "cfgrib>=0.9.12",
    # eccodes 2.45+ is needed to decode GRIB2 tablesVersion=35, used by
    # IFS Cycle 50r1 (12-May-2026). Older versions fail with opaque
    # "unknown parameter" errors on pressure-level messages.
    "eccodes>=2.45",
    "xarray>=2024.1",
    "timezonefinder>=6.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-mock>=3.0", "responses>=0.25"]
frontal-dev = ["cartopy>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (skipped by default, run with: pytest -m slow)",
]
