name: iOS UI (nightly)

# The other half of ios.yml's deliberate split. That workflow gates PRs on the
# hermetic unit target and explains why the XCUI journeys are not gated: they
# drive a simulator, they are the flaky half, and a launch hiccup failing a PR
# teaches everyone to ignore red.
#
# The cost of that choice showed up in PR #556: both of its new UI journeys were
# green here (unit-only) while failing on a real simulator — a lazy-`Form`
# selector that could never resolve, and a post-Move navigation the helper did
# not handle. Nobody was misled for long, but only because the tests happened to
# be run locally. Nightly closes that without putting a flaky gate on anyone's
# PR: breakage surfaces within a day, and the result bundle carries the
# screenshots to explain it.
#
# Not a gate. A failure here is a message, not a block — read it, then decide.

on:
  schedule:
    # 03:17 UTC daily. Off-round minute on purpose: GitHub queues scheduled jobs
    # at the top of the hour, so :00 runs are the ones that get delayed.
    - cron: '17 3 * * *'
  # So it can be run on demand against main before a release without waiting
  # for the small hours.
  workflow_dispatch:

permissions:
  contents: read
  # The `changed` guard reads this workflow's own run history to find the last
  # green SHA. Read-only, like ios.yml — nothing here writes back.
  actions: read

concurrency:
  group: ios-ui-nightly
  cancel-in-progress: false

jobs:
  # `schedule` fires on the clock, not on activity, so without this the macOS
  # runner would re-test an unchanged `main` every night forever. Standard
  # GitHub-hosted runners are free on a public repo (see ios.yml), so this is
  # about not burning compute for an answer we already have, not about billing.
  #
  # Compared against the last *successful* run on purpose: after a failure the
  # SHA is unchanged but the last success is older, so a broken main re-tests
  # nightly until it is fixed rather than going quiet after one red run.
  changed:
    name: New commits since last pass?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" \
                   --workflow ios-ui-nightly.yml --status success \
                   --limit 1 --json headSha -q '.[0].headSha // ""')
          echo "HEAD:          $GITHUB_SHA"
          echo "last green on: ${last:-<none>}"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Unchanged since the last green run — skipping the simulator." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  ui:
    name: xcodebuild test (UI)
    needs: changed
    # A manual run always executes — the point of reaching for the button is
    # usually to re-test the very commit the guard would skip.
    if: github.event_name == 'workflow_dispatch' || needs.changed.outputs.should_run == 'true'
    runs-on: macos-26
    # ~5 min of execution locally on Apple silicon; GitHub's runners are
    # substantially slower and every XCUI test relaunches the app (~15-20s
    # each), so the ceiling is generous.
    timeout-minutes: 60

    env:
      # Both pinned to match ios.yml exactly — the two workflows should differ
      # in *what they run*, nothing else.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17,OS=latest'

    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('app/flyfun-weather/flyfun-weather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project app/flyfun-weather/flyfun-weather.xcodeproj \
            -scheme flyfun-weather \
            -clonedSourcePackagesDirPath .spm

      # -retry-tests-on-failure is what makes this reportable rather than noise:
      # it re-runs only the tests that failed, so a simulator launch hiccup
      # self-heals and what lands in the log is a reproducible failure. The
      # journeys are launch-heavy, so a retry costs one app launch, not a rerun
      # of the suite.
      #
      # One test (testForecastMapOffersSidebarToggleOnPad) is iPad-only and will
      # report as skipped on this destination. Adding an iPad leg means checking
      # a device name that actually exists on the runner image — an unavailable
      # name is a hard failure, not a skip — so it is left for when someone can
      # verify it against the image manifest.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project app/flyfun-weather/flyfun-weather.xcodeproj \
            -scheme flyfun-weather \
            -destination "$DESTINATION" \
            -only-testing:flyfun-weatherUITests \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath ui.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -skipMacroValidation \
            -quiet

      # Same trap as ios.yml: `-only-testing:` matching nothing is a SILENT
      # vacuous pass — "** TEST SUCCEEDED **", exit 0, zero tests run. Worse
      # here, because nobody watches a nightly that is always green.
      - name: Guard against a vacuous pass
        if: always()
        run: |
          summary=$(xcrun xcresulttool get test-results summary --path ui.xcresult)
          total=$(echo "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["totalTestCount"])')
          passed=$(echo "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["passedTests"])')
          failed=$(echo "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["failedTests"])')
          skipped=$(echo "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skippedTests"])')
          echo "UI journeys: $passed passed, $failed failed, $skipped skipped (of $total)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "::error::xcodebuild ran 0 UI tests — the -only-testing filter matched nothing."
            exit 1
          fi
          echo "Ran $total UI tests: $passed passed, $failed failed, $skipped skipped."

          # `-quiet` swallows the assertion text, so without this a red nightly
          # can only be diagnosed by downloading the result bundle — 170 MB to
          # read four lines. Print name + message straight into the run page.
          # One-lined on purpose: inside a `run: |` block a multi-line python -c
          # would need its top-level statements at column 0 to be valid Python,
          # which ends the YAML block scalar.
          if [ "$failed" -gt 0 ]; then
            echo "$summary" | python3 -c "import json,sys; [print('- **%s** - %s' % (t.get('testName'), t.get('failureText'))) for t in json.load(sys.stdin).get('testFailures', [])]" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Always, not just on failure: the journeys attach screenshots
      # (.lifetime = .keepAlways), and a passing run's screenshots are how a
      # layout regression that no assertion covers gets noticed at all.
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-xcresult
          path: ui.xcresult
          retention-days: 14
