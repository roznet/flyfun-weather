services:
  weatherbrief:
    build: .
    container_name: weatherbrief
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "127.0.0.1:8020:8020"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATA_DIR: /app/data
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_ECMWF_GRIB_DIR:-./data/ecmwf}:/data/ecmwf
    group_add:
      - "2002"  # weatherdata — lets app user write sentinels to ECMWF delivery dir
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - shared-services

  mcp-server:
    build: .
    container_name: weatherbrief-mcp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8021:8021"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WEATHERBRIEF_API_URL: http://weatherbrief:8020
      WEATHER_BASE_URL: https://weather.flyfun.aero
      LOG_LEVEL: INFO
    depends_on:
      weatherbrief:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8021),2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - shared-services
    command: ["python", "-m", "weatherbrief.mcp.server", "--transport", "http", "--port", "8021"]

networks:
  shared-services:
    external: true
