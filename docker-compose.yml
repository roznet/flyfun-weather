services:
  weatherbrief:
    build: .
    container_name: weatherbrief
    restart: unless-stopped
    logging:
      # journald: survives container rebuild — `docker compose up -d --build`
      # destroys the container (= new container ID = new json-file logs would
      # be wiped). systemd-journald on the host owns retention via
      # /etc/systemd/journald.conf (SystemMaxUse); query post-rebuild with
      # `journalctl CONTAINER_NAME=weatherbrief --since="..."`.
      driver: journald
      options:
        tag: weatherbrief
    ports:
      - "127.0.0.1:8020:8020"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATA_DIR: /app/data
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_ECMWF_GRIB_DIR:-./data/ecmwf}:/data/ecmwf
    group_add:
      - "2002"  # weatherdata — lets app user write sentinels to ECMWF delivery dir
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Bumped 3G → 4G in #137: 19Z cycle observed transient 2.55 GiB peaks
          # during GFS Open-Meteo fetch (parent process), leaving only ~450 MiB
          # headroom for concurrent briefing refreshes — too tight, fits the
          # 07Z OOM signature.
          #
          # Bumped 4G → 6G on 2026-05-15: hang diag on 08:49 stuck-decode
          # event captured cgroup peak hitting 4 GiB exactly (the limit) with
          # workers=[] (silent OOM-kill of decode workers, parent didn't see
          # BrokenProcessPool, fell through to the 300s timeout). Headroom
          # was the actual bottleneck — page cache + parent (~2 GB) + 2
          # workers (~250 MB each during ICON decode) + cfgrib eccodes
          # native memory accumulating between recycles > 4 GiB peak.
          # Host has ~7.8 GiB, this still leaves ~1.8 GiB for other apps.
          memory: 6G
    networks:
      - shared-services

  mcp-server:
    build: .
    container_name: weatherbrief-mcp
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: weatherbrief-mcp
    ports:
      - "127.0.0.1:8021:8021"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WEATHERBRIEF_API_URL: http://weatherbrief:8020
      WEATHER_BASE_URL: https://weather.flyfun.aero
      LOG_LEVEL: INFO
    depends_on:
      weatherbrief:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8021),2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - shared-services
    command: ["python", "-m", "weatherbrief.mcp.server", "--transport", "http", "--port", "8021"]

networks:
  shared-services:
    external: true
