<!doctype html>
<!--
  Template for the page Caddy serves when weather.flyfun.aero can't answer
  (see handle_errors in deploy/weather.flyfun.aero.caddy). Rendered by
  scripts/ops/maintenance.py, which fills the dollar placeholders (Python
  string.Template, so a literal dollar sign must be doubled) and uploads it
  to ~/www/weather-status/status.html on the droplet. Self-contained on
  purpose: while this page is up, nothing else on the site is reachable.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>$title · FlyFun Weather</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1b2430; --muted: #5d6b7a;
    --accent: #1f6feb; --border: #dde3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a; --card: #18202a; --text: #e6edf3; --muted: #93a1b0;
      --accent: #58a6ff; --border: #2a3542;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px 16px; background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 520px; width: 100%; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px;
  }
  .brand { font-size: 14px; letter-spacing: .04em; text-transform: uppercase;
           color: var(--muted); margin: 0 0 20px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .until { font-weight: 600; color: var(--accent); }
  .small { font-size: 14px; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<main>
  <p class="brand">FlyFun Weather</p>
  <h1>$title</h1>
  <p>$message</p>
  $until_block
  <p class="small">This page reloads by itself every minute. Saved flights stay
  available in the iOS and Android apps in the meantime.</p>
</main>
<script>
  // Add the viewer's local time next to the UTC estimate.
  (function () {
    var el = document.querySelector("[data-until]");
    if (!el) return;
    var d = new Date(el.getAttribute("data-until"));
    if (isNaN(d)) return;
    var local = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    el.textContent += " (" + local + " your time)";
  })();
</script>
</body>
</html>
