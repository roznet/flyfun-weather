<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyfun Weather — Cross-section</title>
  <!-- Frameable cross-section for talks / help pages; see ts/embed-main.ts. -->

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
