<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyfun Weather — Sign In</title>
  <script>((d,s)=>{const t=s.getItem('wb_theme');d.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'})(document.documentElement,localStorage)</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="login-panel">
      <h1>Flyfun Weather</h1>
      <p class="login-subtitle">Aviation weather briefings for GA pilots</p>

      <div id="pending-message" class="pending-message" style="display: none;">
        Your account is currently inactive. Please contact the administrator if you believe this is an error.
      </div>

      <div id="login-buttons">
        <a href="/auth/login/google" class="btn-login btn-login-google" id="btn-google" style="display:none">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 2.58 9 2.58Z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </a>

        <a href="/auth/login/apple" class="btn-login btn-login-apple" id="btn-apple" style="display:none">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.1 14.05c-.35.81-.52 1.17-.97 1.89-.63.99-1.52 2.23-2.62 2.24-1.23.01-1.55-.8-3.22-.79-1.67.01-2.02.81-3.25.79-1.1-.01-1.94-1.12-2.57-2.11C.82 13.49.3 10.56 1.02 8.56c.51-1.41 1.41-2.37 2.43-2.37.96 0 1.56.64 2.35.64.77 0 1.24-.64 2.35-.64.86 0 1.65.47 2.16 1.28-1.9 1.04-1.59 3.75.24 4.47-.38.94-.56 1.36-.97 2.19l.52-.08ZM10.56 4.38c.53-.68.93-1.64.78-2.62-.86.06-1.87.61-2.46 1.33-.53.65-.97 1.62-.8 2.56.94.03 1.92-.53 2.48-1.27Z" fill="currentColor"/>
          </svg>
          Sign in with Apple
        </a>
      </div>
    </div>
  </div>

  <script>
    // Show pending message if redirected after unapproved login
    if (new URLSearchParams(window.location.search).get('status') === 'pending') {
      document.getElementById('pending-message').style.display = 'block';
    }

    // Show only the login buttons for configured providers
    fetch('/auth/providers')
      .then(r => r.json())
      .then(data => {
        const providers = data.providers || [];
        if (providers.includes('google')) document.getElementById('btn-google').style.display = '';
        if (providers.includes('apple')) document.getElementById('btn-apple').style.display = '';
        // Fallback: if no providers configured (dev mode), show Google
        if (providers.length === 0) document.getElementById('btn-google').style.display = '';
      })
      .catch(() => {
        // On error, show Google button as fallback
        document.getElementById('btn-google').style.display = '';
      });
  </script>
</body>
</html>
