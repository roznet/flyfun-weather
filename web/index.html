<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Safari (iOS/iPadOS) Smart App Banner → FlyFunWeather on the App Store -->
  <meta name="apple-itunes-app" content="app-id=6760951972">
  <title>Flyfun Weather — Flights</title>
  <script>((d,s)=>{const t=s.getItem('wb_theme');d.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'})(document.documentElement,localStorage)</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/leaflet.css">
  <link rel="stylesheet" href="/dist/flights.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>My Flights</h1>
      <div class="header-right">
        <button id="tour-btn" class="btn btn-icon" type="button" aria-label="Take the tour" title="Take the tour">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <div id="user-info" class="user-info"></div>
      </div>
    </div>

    <div id="error-message"></div>

    <!-- Create flight form -->
    <div class="create-panel">
      <div class="create-panel-header">
        <h3>New Flight</h3>
        <div style="display:flex;gap:0.5rem;">
          <button type="button" id="btn-paste-fpl" class="btn btn-outline btn-sm" title="Import from ICAO flight plan">Paste FPL</button>
          <button type="button" id="btn-import-autorouter" class="btn btn-outline btn-sm" title="Import a recent route from your Autorouter account">Import from Autorouter</button>
        </div>
      </div>
      <form id="create-flight-form">
        <div class="form-row">
          <div class="form-group grow">
            <div class="label-row">
              <label for="input-waypoints">Waypoints (airports, navaids, fixes)</label>
              <select id="input-route-history" class="route-history-select" style="display:none;">
                <option value="">Recent routes…</option>
              </select>
            </div>
            <div class="waypoints-row" style="display:flex;gap:0.5rem;align-items:stretch;">
              <input type="text" id="input-waypoints" placeholder="EGTF POGOL LFQA LSGS" required style="flex:1;">
              <button type="button" id="btn-preview-route" class="btn btn-outline btn-sm" title="Preview interpreted route on a map">Interpret</button>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="input-aircraft">Aircraft <button type="button" class="metric-info-btn aircraft-info-btn" title="Aircraft info" aria-label="Aircraft info">i</button></label>
            <select id="input-aircraft">
              <option value="">None</option>
            </select>
          </div>
          <div class="form-group">
            <label for="input-profile">Profile <button type="button" class="metric-info-btn profile-info-btn" title="Profile info" aria-label="Profile info">i</button></label>
            <select id="input-profile"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="input-date">Date</label>
            <input type="date" id="input-date" required>
          </div>
          <div class="form-group">
            <label for="input-hour">Time</label>
            <div class="time-input-group">
              <select id="input-hour"></select>
              <span class="time-separator">:</span>
              <select id="input-minute">
                <option value="0">00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
              </select>
              <select id="input-timezone">
                <option value="UTC">UTC</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="input-altitude">Altitude (ft)</label>
            <input type="number" id="input-altitude" value="8000" min="1000" max="45000" step="500">
          </div>
          <div class="form-group">
            <label for="input-ceiling">Ceiling (ft)</label>
            <input type="number" id="input-ceiling" value="18000" min="1000" max="45000" step="500">
          </div>
          <div class="form-group">
            <label for="input-duration-hours">Duration</label>
            <div class="time-input-group">
              <!-- Options populated from duration.ts helpers in flights-main.ts -->
              <select id="input-duration-hours"></select>
              <span class="time-separator">h</span>
              <select id="input-duration-minutes"></select>
              <span class="time-separator">m</span>
            </div>
          </div>
          <div class="form-group">
            <label for="input-flexibility" title="How much departure flexibility you have — scans other times in the background after each briefing">Flexibility</label>
            <select id="input-flexibility">
              <option value="none" selected>None</option>
              <option value="same_day">Same day</option>
              <option value="prev_day">Previous day</option>
              <option value="next_day">Next day</option>
            </select>
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <button type="submit" class="btn btn-primary">Create Flight</button>
          </div>
        </div>
      </form>
    </div>

    <div id="loading-spinner">Loading flights...</div>

    <!-- Upcoming-flights filter (#542). Deliberately outside #flight-list:
         that container is re-rendered wholesale on every state change, which
         would destroy this input (and the caret) mid-keystroke. Hidden until
         the upcoming list is long enough to be worth filtering. -->
    <div id="upcoming-filter-row" class="list-filter-row" hidden>
      <div class="list-filter">
        <svg class="list-filter-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <!-- maxlength is set from MAX_QUERY_LEN by wireUpcomingFilter, so the
             shared constant stays the single source of truth. -->
        <input type="text" id="upcoming-filter-input" class="list-filter-input"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" id="upcoming-filter-clear" class="list-filter-clear" hidden>&times;</button>
      </div>
      <span id="upcoming-filter-count" class="list-filter-count"></span>
    </div>

    <!-- Flight list -->
    <div id="flight-list"></div>
  </div>

  <script src="/dist/flights.js"></script>
</body>
</html>
