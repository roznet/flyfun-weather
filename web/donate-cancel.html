<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyfun Weather — Donation Cancelled</title>
  <script>((d,s)=>{const t=s.getItem('wb_theme');d.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'})(document.documentElement,localStorage)</script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cancel { text-align: center; padding: 3rem 1rem; max-width: 50ch; margin: 0 auto; }
    .cancel h1 { margin-bottom: 0.75rem; }
    .cancel p { color: var(--text-muted); margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="cancel">
      <h1>No worries</h1>
      <p>
        Your donation was cancelled and you haven't been charged. Flyfun Weather stays
        free regardless — thank you for considering it.
      </p>
      <a href="/donate.html" class="btn btn-primary">Back to support</a>
      <a href="/flights.html" class="btn btn-secondary">Go to my flights</a>
    </div>
  </div>
</body>
</html>
