<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherBrief — Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .admin-table th,
    .admin-table td {
      padding: 0.5rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .admin-table th {
      background: var(--bg);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .admin-table td.num {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .summary-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      text-align: center;
    }
    .summary-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .summary-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Admin</h1>
      <div class="header-right">
        <a href="/help.html" class="btn-settings">Help</a>
        <a href="/settings.html" class="btn-settings">Settings</a>
        <a href="/" class="btn-settings">Flights</a>
        <div id="user-info" class="user-info"></div>
      </div>
    </div>

    <div id="error-message" style="display:none;"></div>

    <!-- Summary stats -->
    <div id="summary-bar" class="summary-bar" style="display:none;"></div>

    <!-- Pending approvals -->
    <div id="pending-section" class="section" style="display:none;">
      <h3>Pending Approvals</h3>
      <div id="pending-list"></div>
    </div>

    <!-- All users -->
    <div class="section">
      <h3>All Users</h3>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Status</th>
              <th>Last Active</th>
              <th style="text-align:center;">Briefings (Mo)</th>
              <th style="text-align:center;">GRAMET (Mo)</th>
              <th style="text-align:center;">LLM (Mo)</th>
              <th style="text-align:center;">Tokens (Mo)</th>
              <th style="text-align:center;">Disk</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="9" class="muted" style="text-align:center;padding:2rem;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/dist/admin.js"></script>
</body>
</html>
